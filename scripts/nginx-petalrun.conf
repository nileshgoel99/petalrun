# PetalRun / Fleurish & Co. — petalrun.fabriflow.in
# Gunicorn on 127.0.0.1:8003

server {
    listen 80;
    listen [::]:80;
    server_name petalrun.fabriflow.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name petalrun.fabriflow.in;

    # Certbot will fill these on first run; placeholders replaced after certbot
    # ssl_certificate /etc/letsencrypt/live/petalrun.fabriflow.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/petalrun.fabriflow.in/privkey.pem;

    root /var/www/petalrun/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8003/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-static/ {
        alias /var/www/petalrun/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
